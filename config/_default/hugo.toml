# Structural site configuration. Owner-editable settings (identity, social links,
# palette, enabled sections) live in params.yaml so the /admin dashboard can edit
# them as YAML.
baseURL = "https://2ood.github.io/ai-researcher/"
locale = "en"
title = "Kyungmin Choi"

[taxonomies]
  tag = "tags"

[markup]
  [markup.highlight]
    style = "github"
    lineNos = false
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
