- title: Abstract Reasoning & ARC
  summary: How can machines acquire the kind of fluid, compositional reasoning that ARC-style tasks demand?
  details: |
    The Abstraction and Reasoning Corpus (ARC) resists the pattern-matching that powers most modern models: each task is novel, few-shot, and solvable only by composing a small set of human-intuitive priors. I study how to give models
    those priors explicitly and how to evaluate genuine reasoning rather than memorization. testing [link](/research-interests/)
- title: Gestalt-level Reasoning Machine
  summary: Examining what should be done, not what seems working.
  details: |-
    We are seeking to  build a thought machine via language models. LMs are language experts in core, so its outputs are very intuitive and straight-forward. It also have great quantities of data to train from. However, is this the right way to implement a thought process?

    But, are we solely thinking in a way linguistic pattern directs us? There are more drives, for instance our preferences or background expertises. In other words, we 'choose' the next trailing thoughts out of a number of possibly coherent thoughts, each of them linguistically correct. Being linguistically correct is a minimal requirement, as it guarantees that the thought is comprehensible by all the language speakers, which in turn means a thought is verified to be reachable by multiple persons. 

    Linguistic expressibility is sometimes a big hurdle for a novel thought to pass, because the thought underneath might be never expressed in language before. Some ideas are hardly expressible, either it has not enough words to express and restore (like subjective taste experiences or newly made theories), or it is practically too delicate to elaborate in words (like expressing dance moves in words). Thus in some ways, language format itself is a bottleneck filter of thoughts when it comes to thought machines.

    We need to examine more on what makes two ideas coherent, and how do we induce the next with the given. We need to examine if a thought is discrete, comparable, sortable, decomposable, partial-modifiable, reusable. After that, we need to find what pathways makes the next coherent statements. 
- title: Reasoning & the Philosophy of Science
  summary: What the history of physics can teach us about interpreting learned representations.
  details: |
    Deep learning often feels like an empirical science still waiting for its theory. I'm interested in what the conceptual upheavals of early quantum mechanics suggest about how we should interpret (and trust) the high-dimensional representations our models learn.
